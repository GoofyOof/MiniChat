<!DOCTYPE html>
<html>
<head>
    <title>Registrer deg - MiniChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <h1>MiniChat</h1>

            <h2>Opprett konto</h2>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Brukernavn"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Passord"
                    required
                >

                <button type="submit">
                    Opprett konto
                </button>

            </form>

        </div>

    </div>

</body>
</html>
