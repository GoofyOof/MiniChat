<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opprett konto - MiniChat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="register-container">

    <div class="register-box">

        <h1>MiniChat</h1>

        <h2>Opprett konto</h2>

        {% if error %}
            <p style="color: #EF4444; text-align: center;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Velg brukernavn"
                required
                maxlength="30"
                autocomplete="username"
            >

            <input
                type="password"
                name="password"
                placeholder="Velg passord"
                required
                autocomplete="new-password"
            >

            <button type="submit">
                Opprett konto
            </button>

        </form>

        <p>
            Har du allerede konto?
            <a href="{{ url_for('login') }}">
                Logg inn
            </a>
        </p>

        <p>
            <a href="{{ url_for('rules') }}">
                📜 Les regler
            </a>
        </p>

    </div>

</div>

</body>
</html>
