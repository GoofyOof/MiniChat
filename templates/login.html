<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logg inn - MiniChat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="register-container">

    <div class="register-box">

        <h1>MiniChat</h1>

        <h2>Logg inn</h2>

        {% if error %}
            <p style="color: #EF4444; text-align: center;">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Brukernavn"
                required
                autocomplete="username"
            >

            <input
                type="password"
                name="password"
                placeholder="Passord"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Logg inn
            </button>

        </form>

        <p>
            Har du ikke konto?
            <a href="{{ url_for('register') }}">
                Opprett konto
            </a>
        </p>

        <p>
            <a href="{{ url_for('rules') }}">
                📜 Les regler
            </a>
        </p>

<p class="made-by">
    Laget av <strong>PeakLabs</strong>
</p>

</div>

</div>

</body>
</html>
