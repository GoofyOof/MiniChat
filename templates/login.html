<!DOCTYPE html>
<html>
<head>
    <title>Logg inn - MiniChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <h1>MiniChat</h1>

            <h2>Logg inn</h2>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Brukernavn"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Passord"
                    required
                >

                <button type="submit">
                    Logg inn
                </button>

            </form>

            <p>
                Har du ikke konto?
                <a href="/register">Registrer deg</a>
            </p>

        </div>

    </div>

</body>
</html>
